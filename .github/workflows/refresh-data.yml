name: refresh-data

# Fetches prices, news, earnings and predictions, then publishes them as CSV files on the `data` branch.
# The Streamlit site reads those files; it never needs Yahoo to be reachable from Streamlit's servers.
on:
  schedule:
    - cron: "*/30 * * * 1-5"   # every 30 minutes on weekdays (UTC; GitHub may delay runs)
    - cron: "17 */6 * * 0,6"   # every 6 hours at weekends
  workflow_dispatch:           # lets you run it by hand from the Actions tab

concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Restore previous snapshot (skipped on the very first run)
        uses: actions/checkout@v4
        with:
          ref: data
          path: _data
        continue-on-error: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-job.txt

      - run: pip install -r requirements-job.txt

      - name: Run data job
        run: python refresh_job.py --snapshot _data/snapshot --watchlist-file watchlist.txt --predict --intraday

      - name: Publish snapshot to the data branch (history is replaced each time so the repo never grows)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _data
          rm -rf .git
          git init -q
          git checkout -q -b data
          git config user.name "mkresearch-bot"
          git config user.email "mkresearch-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q -f origin data
